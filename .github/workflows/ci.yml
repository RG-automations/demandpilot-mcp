name: CI

"on":
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks needs full history, not just the latest commit

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Run tests with coverage
        run: pytest tests/ --cov=demandpilot --cov-report=term-missing

      - name: Dependency vulnerability audit
        run: |
          python -m pip install pip-audit
          pip-audit

      # Pinned to the commit for release v3.0.0 (not under actions/*, so pinned
      # to a SHA rather than a tag, per this project's security conventions).
      # Runs once (not once per Python version) since the scan result doesn't
      # depend on the interpreter.
      - name: Gitleaks secret scan
        if: matrix.python-version == '3.12'
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
